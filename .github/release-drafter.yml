name-template: 'v$NEXT_PATCH_VERSION'
tag-template: 'v$NEXT_PATCH_VERSION'
categories:
  - title: '🚀 Features'
    labels: ['feat', 'feature', 'enhancement']
  - title: '🐛 Fixes'
    labels: ['fix', 'bug']
  - title: '🧪 Tests'
    labels: ['test', 'tests']
  - title: '🧹 Maintenance'
    labels: ['chore', 'maintenance', 'deps']
  - title: '🛡 Security'
    labels: ['security']
change-template: '- $TITLE (#$NUMBER) by @$AUTHOR'
template: |
  ## What’s Changed
  $CHANGES
