# Build output and vendored assets are not ours to reformat: `make ui-build` regenerates
# static_app, and the vendor files are upstream releases.
exclude: ^freemad/dashboard/(static_app|static/vendor)/

repos:
  # ruff-format is the single formatter. Running black alongside it ping-ponged: black
  # reflows a long `except X as e:  # comment` into a parenthesised form, ruff-format
  # reflows it back, and any file with that construct failed the gate on every commit.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-merge-conflict
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-toml
      - id: check-json
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.9
    hooks:
      - id: bandit
        # -ll: gate on Medium and above. This project is a subprocess orchestrator, so
        # the ~34 Low hits (B404/B603) are its whole purpose, not findings.
        # Tests are excluded: a fake "/tmp/wt" path in an argv-construction test is
        # not a hardcoded temp directory.
        args: ["-q", "-ll", "-r", "freemad"]
        exclude: ^tests/
