[mypy]
python_version = 3.10
ignore_missing_imports = True
warn_unused_ignores = False
warn_redundant_casts = True
warn_unused_configs = True
strict_optional = True
no_implicit_optional = True
check_untyped_defs = True
disallow_untyped_defs = False
disallow_any_generics = False
warn_return_any = False
# examples/ are evolve *targets* the agent rewrites, not the package; the
# dependency-update one deliberately reaches its vendored module by two names.
exclude = ^examples/

# PyYAML ships no stubs and CI installs no types-PyYAML; the package itself
# already imports it under `# type: ignore`. The global flag is not honoured
# for typeshed's legacy bundled packages, so it has to be per-module.
[mypy-yaml.*]
ignore_missing_imports = True
